<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminhão em Movimento - Line Art</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow: hidden;
            touch-action: manipulation;
            background-color: transparent;
        }
        @keyframes bounceTruck {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        @keyframes speedLinesAnim {
            0% { transform: translateX(0); opacity: 0.9; }
            50% { transform: translateX(-15px); opacity: 0.4; }
            100% { transform: translateX(0); opacity: 0.9; }
        }
        .truck-bounce {
            animation: bounceTruck 0.3s ease-in-out infinite;
        }
        .speed-lines {
            animation: speedLinesAnim 0.4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-transparent h-screen w-screen flex flex-col justify-center items-center select-none m-0 p-0 overflow-hidden">

    <div class="relative w-full max-w-4xl h-72 flex flex-col justify-end overflow-hidden bg-transparent">
        
        <!-- Pista com linha preta minimalista -->
        <div class="absolute bottom-12 w-full h-12 overflow-hidden border-t-4 border-black bg-transparent">
            <div id="roadMarks" class="absolute inset-0 flex items-center">
                <!-- Marcações de asfalto geradas via JavaScript -->
            </div>
        </div>

        <!-- O Caminhão em Line Art idêntico à referência -->
        <div id="truckContainer" class="absolute bottom-8 left-16 z-10 transition-all duration-300 truck-bounce cursor-pointer" title="Clique para pausar/continuar">
            <svg width="320" height="150" viewBox="0 0 320 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                
                <!-- Linhas de velocidade traseiras -->
                <g class="speed-lines" stroke="black" stroke-width="4" stroke-linecap="round">
                    <line x1="5" y1="35" x2="65" y2="35" />
                    <line x1="25" y1="58" x2="65" y2="58" />
                    <line x1="15" y1="82" x2="65" y2="82" />
                </g>

                <!-- Baú do Caminhão -->
                <rect x="65" y="20" width="130" height="85" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
                
                <!-- Divisão do baú com a cabine -->
                <line x1="195" y1="20" x2="195" y2="105" stroke="black" stroke-width="5"/>

                <!-- Cabine do Caminhão -->
                <path d="M195 45 L235 45 L275 80 L285 85 L285 105 L195 105 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
                
                <!-- Janela da Cabine -->
                <path d="M205 50 L240 50 L265 75 L205 75 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
                
                <!-- Para-brisa -->
                <line x1="242" y1="50" x2="252" y2="75" stroke="black" stroke-width="4"/>

                <!-- Parachoque -->
                <path d="M275 95 L290 95 L290 105 L275 105 Z" fill="black"/>

                <!-- Rodas -->
                <!-- Roda traseira -->
                <circle cx="100" cy="115" r="20" fill="white" stroke="black" stroke-width="5"/>
                <circle cx="100" cy="115" r="7" fill="black"/>

                <!-- Roda dianteira -->
                <circle cx="245" cy="115" r="20" fill="white" stroke="black" stroke-width="5"/>
                <circle cx="245" cy="115" r="7" fill="black"/>

                <!-- Detalhes no asfalto -->
                <line x1="120" y1="135" x2="150" y2="135" stroke="black" stroke-width="6"/>
                <line x1="200" y1="135" x2="230" y2="135" stroke="black" stroke-width="6"/>
            </svg>
        </div>

    </div>

    <script>
        const truckContainer = document.getElementById('truckContainer');
        const roadMarks = document.getElementById('roadMarks');

        let isRunning = true;

        // Alternar pausa ao clicar no caminhão
        truckContainer.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                truckContainer.classList.add('truck-bounce');
            } else {
                truckContainer.classList.remove('truck-bounce');
            }
        });

        // Criar faixas da estrada em movimento contínuo
        function createRoadMark() {
            if (!isRunning) return;

            const mark = document.createElement('div');
            mark.style.position = 'absolute';
            mark.style.height = '6px';
            mark.style.width = '70px';
            mark.style.backgroundColor = 'black';
            mark.style.left = '100%';
            roadMarks.appendChild(mark);

            let pos = 100;
            const moveStep = 1.2;

            const interval = setInterval(() => {
                if (!isRunning) return;
                pos -= moveStep;
                mark.style.left = `${pos}%`;

                if (pos < -20) {
                    clearInterval(interval);
                    mark.remove();
                }
            }, 20);
        }

        // Gerar marcações periodicamente
        setInterval(() => {
            if (isRunning) {
                createRoadMark();
            }
        }, 350);
    </script>
</body>
</html>
